<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mallverse — Shopping Network Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ============================================================
   MALLVERSE DESIGN SYSTEM
   Base: deep navy/indigo. Accent: signal amber (primary action,
   revenue/positive data) + cyan (secondary data series).
   Type: Inter (UI) / Inter Tight (numerals & headlines).
   ============================================================ */

:root{
  --bg:#0A0F1C;
  --bg-elevated:#0E1526;
  --panel:#121A2E;
  --panel-2:#182238;
  --panel-3:#1D2842;
  --border:#232E4A;
  --border-soft:#1A2338;
  --text:#EAEDF7;
  --text-secondary:#9AA5C4;
  --text-muted:#67719A;
  --accent:#F5A623;
  --accent-ink:#2A1A00;
  --accent-soft:rgba(245,166,35,0.14);
  --accent-2:#2DD4E8;
  --accent-2-soft:rgba(45,212,232,0.14);
  --success:#3ECF8E;
  --success-soft:rgba(62,207,142,0.14);
  --warning:#F5C543;
  --warning-soft:rgba(245,197,67,0.14);
  --danger:#F16A6A;
  --danger-soft:rgba(241,106,106,0.14);
  --info:#6C9CF5;
  --info-soft:rgba(108,156,245,0.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.24);
  --shadow-md:0 8px 24px rgba(2,6,16,0.36);
  --shadow-lg:0 16px 48px rgba(2,6,16,0.5);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --sidebar-w:248px;
  --sidebar-w-collapsed:76px;
  --header-h:64px;
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'Inter Tight','Inter',sans-serif;
}

html[data-theme="light"]{
  --bg:#F3F4F9;
  --bg-elevated:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F6F7FB;
  --panel-3:#EDEFF6;
  --border:#E2E5F0;
  --border-soft:#EAEDF5;
  --text:#141A2C;
  --text-secondary:#525C79;
  --text-muted:#8790AB;
  --accent:#C97C0C;
  --accent-ink:#FFF7EA;
  --accent-soft:rgba(201,124,12,0.10);
  --accent-2:#0B8FA6;
  --accent-2-soft:rgba(11,143,166,0.10);
  --success:#1C9A63;
  --success-soft:rgba(28,154,99,0.10);
  --warning:#B57F0A;
  --warning-soft:rgba(181,127,10,0.10);
  --danger:#D14444;
  --danger-soft:rgba(209,68,68,0.10);
  --info:#3568D4;
  --info-soft:rgba(53,104,212,0.10);
  --shadow-sm:0 1px 2px rgba(20,26,44,0.06);
  --shadow-md:0 8px 24px rgba(20,26,44,0.08);
  --shadow-lg:0 16px 40px rgba(20,26,44,0.12);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;color:var(--text)}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
ul{list-style:none}
::selection{background:var(--accent-soft);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--bg)}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}

/* Sidebar */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;
  transition:width .2s ease;
  z-index:40;
}
#sidebar.collapsed{width:var(--sidebar-w-collapsed)}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 18px;height:var(--header-h);
  border-bottom:1px solid var(--border-soft);
  flex-shrink:0;overflow:hidden;
}
.brand-mark{
  width:32px;height:32px;flex-shrink:0;border-radius:9px;
  background:linear-gradient(155deg,var(--accent) 0%,#D6870E 100%);
  display:flex;align-items:center;justify-content:center;
  color:#1A1200;font-family:var(--font-display);font-weight:800;font-size:16px;
  box-shadow:0 2px 10px rgba(245,166,35,0.35);
}
.brand-text{overflow:hidden;white-space:nowrap}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:15.5px;letter-spacing:-0.01em;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--text-muted);letter-spacing:.02em;margin-top:2px}
#sidebar.collapsed .brand-text{display:none}

.nav-scroll{flex:1;overflow-y:auto;padding:14px 12px}
.nav-group{margin-bottom:18px}
.nav-group-label{
  font-size:10.5px;font-weight:600;color:var(--text-muted);
  padding:0 10px;margin-bottom:6px;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;height:14px;
}
#sidebar.collapsed .nav-group-label{opacity:0}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:8px;color:var(--text-secondary);
  font-size:13.5px;font-weight:500;cursor:pointer;
  margin-bottom:2px;white-space:nowrap;overflow:hidden;
  transition:background .12s ease,color .12s ease;position:relative;
}
.nav-item svg{flex-shrink:0;width:17px;height:17px}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .badge-count{
  margin-left:auto;font-size:10.5px;font-weight:700;color:var(--text-muted);
  background:var(--panel-3);padding:1px 6px;border-radius:20px;
}
.nav-item.active .badge-count{color:var(--accent);background:rgba(245,166,35,0.16)}
#sidebar.collapsed .nav-item span,#sidebar.collapsed .badge-count{display:none}
#sidebar.collapsed .nav-item{justify-content:center}

.sidebar-footer{
  border-top:1px solid var(--border-soft);padding:12px;flex-shrink:0;
}
.user-row{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;
}
.user-row:hover{background:var(--panel-2)}
.avatar{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(155deg,var(--accent-2),#1591A3);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12.5px;color:#03252A;font-family:var(--font-display);
}
.user-meta{overflow:hidden;white-space:nowrap;flex:1}
.user-name{font-size:13px;font-weight:600}
.user-role{font-size:11px;color:var(--text-muted)}
#sidebar.collapsed .user-meta{display:none}
.collapse-toggle{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:7px;margin-top:8px;border-radius:8px;border:1px solid var(--border-soft);
  background:transparent;color:var(--text-muted);font-size:11.5px;
}
.collapse-toggle:hover{color:var(--text);border-color:var(--border)}
.collapse-toggle svg{width:14px;height:14px}

/* Main column */
#main-col{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  height:var(--header-h);flex-shrink:0;
  display:flex;align-items:center;gap:14px;
  padding:0 24px;border-bottom:1px solid var(--border-soft);
  background:var(--bg-elevated);position:sticky;top:0;z-index:30;
}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--text);padding:6px}
.topbar-search{
  flex:1;max-width:380px;display:flex;align-items:center;gap:8px;
  background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;
  padding:8px 12px;color:var(--text-muted);transition:border-color .15s;
}
.topbar-search:focus-within{border-color:var(--accent)}
.topbar-search input{background:none;border:none;outline:none;color:var(--text);flex:1;font-size:13px}
.topbar-search svg{width:15px;height:15px;flex-shrink:0}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid transparent;color:var(--text-secondary);position:relative;
  transition:background .12s,border-color .12s;
}
.icon-btn:hover{background:var(--panel-2);border-color:var(--border-soft);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.notif-dot{
  position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--danger);border:1.5px solid var(--bg-elevated);
}
.mall-select{
  display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border-soft);
  border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;
}
.mall-select svg{width:14px;height:14px;color:var(--text-muted)}

#view-root{flex:1;padding:26px 28px 60px;max-width:1520px;width:100%}

/* ---------- Typography helpers ---------- */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.015em}
.page-subtitle{font-size:13px;color:var(--text-secondary);margin-top:4px}
.section-title{font-size:15px;font-weight:700;margin-bottom:2px}
.section-desc{font-size:12.5px;color:var(--text-muted)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;
  font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;
  transition:filter .12s,background .12s,border-color .12s;
}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-secondary{background:var(--panel-2);color:var(--text);border-color:var(--border-soft)}
.btn-secondary:hover{border-color:var(--border);background:var(--panel-3)}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{color:var(--text);background:var(--panel-2)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{filter:brightness(1.1)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Cards / Panels ---------- */
.card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:20px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:18px 18px 16px;position:relative;overflow:hidden;
}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi-icon svg{width:17px;height:17px}
.kpi-label{font-size:12px;color:var(--text-muted);font-weight:600}
.kpi-value{font-size:25px;font-weight:800;font-family:var(--font-display);letter-spacing:-0.02em;margin-bottom:6px}
.kpi-trend{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.kpi-trend svg{width:13px;height:13px}
.trend-up{color:var(--success)}
.trend-down{color:var(--danger)}
.kpi-trend-label{color:var(--text-muted);font-weight:500}

/* Grids for dashboard */
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.dash-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:1180px){.dash-grid,.dash-grid-3{grid-template-columns:1fr}}

.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.chip-row{display:flex;gap:6px}
.chip{
  font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;color:var(--text-muted);
  background:var(--panel-2);border:1px solid transparent;cursor:pointer;
}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chart-wrap{padding:8px 14px 18px}

/* Activity list */
.activity-list{padding:6px 8px 12px}
.activity-item{display:flex;gap:11px;padding:10px 10px;border-radius:9px}
.activity-item:hover{background:var(--panel-2)}
.activity-icon{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.activity-icon svg{width:15px;height:15px}
.activity-body{flex:1;min-width:0}
.activity-text{font-size:12.8px;color:var(--text);line-height:1.4}
.activity-text b{font-weight:600}
.activity-time{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Status badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:20px;white-space:nowrap;
}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-muted{background:var(--panel-3);color:var(--text-muted)}

/* Tables */
.table-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);overflow:hidden}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.search-box{
  display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border-soft);
  border-radius:8px;padding:8px 11px;min-width:220px;flex:1;max-width:320px;
}
.search-box input{background:none;border:none;outline:none;color:var(--text);flex:1;font-size:12.8px}
.search-box svg{width:14px;height:14px;color:var(--text-muted);flex-shrink:0}
.select-filter{
  background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px;
  font-size:12.5px;color:var(--text);font-weight:500;
}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{
  text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:none;
  padding:11px 18px;border-bottom:1px solid var(--border-soft);white-space:nowrap;letter-spacing:.02em;
  cursor:pointer;user-select:none;
}
thead th:hover{color:var(--text)}
tbody td{padding:13px 18px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--panel-2)}
.cell-primary{font-weight:600;color:var(--text)}
.cell-muted{color:var(--text-muted)}
.cell-with-avatar{display:flex;align-items:center;gap:10px}
.mini-avatar{
  width:30px;height:30px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-family:var(--font-display);
  background:var(--panel-3);color:var(--text-secondary);
}
.row-actions{display:flex;gap:4px;opacity:1}
.table-empty{padding:60px 20px;text-align:center;color:var(--text-muted)}
.table-empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.5}
.table-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border-soft)}

/* Card grid (malls page) */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mall-card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;
}
.mall-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.mall-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.mall-card-name{font-size:15.5px;font-weight:700;margin-bottom:3px}
.mall-card-loc{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.mall-card-loc svg{width:12px;height:12px}
.mall-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mall-stat{background:var(--panel-2);border-radius:9px;padding:9px 11px}
.mall-stat-val{font-size:15px;font-weight:700;font-family:var(--font-display)}
.mall-stat-lbl{font-size:10.5px;color:var(--text-muted);margin-top:1px}
.mall-card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-muted)}

/* Progress bar */
.progress-track{height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden}
.progress-fill{height:100%;border-radius:6px;background:var(--accent)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-soft);margin-bottom:18px}
.tab-btn{padding:11px 4px;margin-right:22px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;position:relative;top:1px}
.tab-btn.active{color:var(--text);border-color:var(--accent)}

/* Detail header */
.detail-back{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:12.5px;font-weight:600;margin-bottom:14px}
.detail-back:hover{color:var(--text)}
.detail-back svg{width:14px;height:14px}
.detail-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.detail-hero-left{display:flex;align-items:center;gap:14px}
.detail-avatar{
  width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,var(--panel-3),var(--panel-2));font-size:18px;font-weight:800;
  font-family:var(--font-display);color:var(--accent);border:1px solid var(--border-soft);
}
.detail-title{font-size:19px;font-weight:800}
.detail-meta{display:flex;gap:12px;color:var(--text-muted);font-size:12.5px;margin-top:4px;flex-wrap:wrap}
.detail-meta span{display:flex;align-items:center;gap:4px}
.detail-meta svg{width:12px;height:12px}

/* Rating stars */
.stars{display:inline-flex;gap:2px;color:var(--accent)}
.stars svg{width:13px;height:13px}
.rating-bar-row{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:8px}
.rating-bar-row .lbl{width:42px;color:var(--text-muted);flex-shrink:0}
.rating-bar-row .progress-track{flex:1}
.rating-bar-row .pct{width:34px;text-align:right;color:var(--text-muted);flex-shrink:0}

/* Review card */
.review-card{border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;background:var(--panel)}
.review-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.review-comment{font-size:13px;color:var(--text-secondary);line-height:1.55;margin:8px 0}
.review-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--text-muted)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,7,16,0.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .16s ease;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{
  background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  width:100%;max-width:480px;box-shadow:var(--shadow-lg);max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(8px) scale(.98);transition:transform .16s ease;
}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1)}
.modal-box.modal-lg{max-width:680px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-soft);flex-shrink:0}
.modal-title{font-size:15.5px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border-soft);flex-shrink:0}
.modal-close{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);background:transparent;border:none}
.modal-close:hover{background:var(--panel-2);color:var(--text)}

.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.form-input,.form-select,.form-textarea{
  width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:13px;outline:none;transition:border-color .12s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:70px}
.form-hint{font-size:11px;color:var(--text-muted);margin-top:5px}

/* Toast */
#toast-stack{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{
  display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border-soft);
  border-left:3px solid var(--success);border-radius:9px;padding:12px 14px;box-shadow:var(--shadow-lg);
  font-size:12.8px;font-weight:500;animation:toast-in .2s ease;
}
.toast svg{width:16px;height:16px;flex-shrink:0;color:var(--success)}
.toast.danger{border-left-color:var(--danger)}
.toast.danger svg{color:var(--danger)}
.toast.info{border-left-color:var(--info)}
.toast.info svg{color:var(--info)}
@keyframes toast-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

/* Empty state */
.empty-state{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-state svg{width:38px;height:38px;margin-bottom:12px;opacity:.5}
.empty-state h3{font-size:14.5px;color:var(--text);margin-bottom:5px}
.empty-state p{font-size:12.8px}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel-3) 37%,var(--panel-2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Notif panel */
.notif-panel{
  position:absolute;top:56px;right:24px;width:340px;background:var(--bg-elevated);
  border:1px solid var(--border-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  z-index:60;max-height:420px;display:flex;flex-direction:column;opacity:0;transform:translateY(-6px);
  pointer-events:none;transition:opacity .14s,transform .14s;
}
.notif-panel.open{opacity:1;transform:translateY(0);pointer-events:auto}
.notif-panel-head{padding:14px 16px;border-bottom:1px solid var(--border-soft);font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.notif-panel-body{overflow-y:auto;padding:6px}
.notif-item{display:flex;gap:10px;padding:10px;border-radius:8px}
.notif-item:hover{background:var(--panel-2)}
.notif-item .activity-icon{width:28px;height:28px}

/* Analytics small tables */
.perf-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.perf-row:last-child{border-bottom:none}
.perf-rank{width:22px;font-size:12px;font-weight:700;color:var(--text-muted)}
.perf-name{flex:1;font-size:12.8px;font-weight:600}
.perf-sub{font-size:11px;color:var(--text-muted)}
.perf-val{font-size:13px;font-weight:700;font-family:var(--font-display)}

/* Settings */
.settings-grid{display:grid;grid-template-columns:220px 1fr;gap:24px}
.settings-nav .nav-item{color:var(--text-secondary)}
.settings-section{margin-bottom:26px;padding-bottom:26px;border-bottom:1px solid var(--border-soft)}
.settings-section:last-child{border-bottom:none}
.toggle{width:40px;height:22px;border-radius:20px;background:var(--panel-3);position:relative;cursor:pointer;flex-shrink:0;border:1px solid var(--border-soft)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--text-muted);top:2px;left:2px;transition:.16s}
.toggle.on{background:var(--accent-soft);border-color:var(--accent)}
.toggle.on::after{background:var(--accent);left:20px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.settings-row-label{font-size:13px;font-weight:600}
.settings-row-desc{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.theme-swatches{display:flex;gap:10px}
.theme-swatch{width:74px;padding:10px;border-radius:10px;border:2px solid var(--border-soft);cursor:pointer;text-align:center;font-size:11px;font-weight:600;color:var(--text-muted)}
.theme-swatch.active{border-color:var(--accent);color:var(--accent)}
.theme-swatch-preview{height:36px;border-radius:6px;margin-bottom:6px}

/* Responsive */
.mobile-overlay{display:none}
@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  #sidebar.mobile-open{transform:translateX(0)}
  #sidebar.collapsed{width:var(--sidebar-w)}
  #sidebar.collapsed .brand-text,#sidebar.collapsed .nav-item span,#sidebar.collapsed .user-meta,#sidebar.collapsed .badge-count{display:block}

  .collapse-toggle{display:none}
  .mobile-menu-btn{display:flex}
  .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(4,7,16,.5);z-index:39}
  .mobile-overlay.open{display:block}
  #view-root{padding:18px 14px 50px}
  .topbar{padding:0 14px}
  .topbar-search{display:none}
  .dash-grid,.dash-grid-3{grid-template-columns:1fr}
  .settings-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .notif-panel{right:14px;width:calc(100vw - 28px)}
}
@media(max-width:520px){
  .kpi-grid{grid-template-columns:1fr}
  .page-header{flex-direction:column;align-items:stretch}
  .mall-select{display:none}
}

    'Suspended':{cls:'badge-danger', label:'Suspenso'},
    'Published':{cls:'badge-success', label:'Publicada'},
    'Pending':{cls:'badge-warning', label:'Pendente'},
    'Flagged':{cls:'badge-danger', label:'Sinalizada'},
  };
  const m = map[status] || {cls:'badge-muted', label:status};
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

function starRow(rating, size){
  let s='';
  for(let i=1;i<=5;i++){
    s += i<=Math.round(rating) ? icon('star') : icon('star');
  }
  return `<span class="stars">${Array.from({length:5}).map((_,i)=>
    `<svg viewBox="0 0 24 24" fill="${i<Math.round(rating)?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
  ).join('')}</span>`;
}

/* ---------- Toasts ---------- */
function toast(msg, type='success'){
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='success'?'':type);
  const iconName = type==='danger' ? 'circle-x' : type==='info' ? 'info' : 'circle-check';
  el.innerHTML = `${icon(iconName)}<span>${msg}</span>`;
  stack.appendChild(el);
  renderIcons();
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(12px)'; el.style.transition='.18s'; setTimeout(()=>el.remove(),180); }, 3200);
}

/* ---------- Modal ---------- */
function openModal(html, size){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal-box ${size==='lg'?'modal-lg':''}">${html}</div></div>`;
  renderIcons();
  requestAnimationFrame(()=>document.getElementById('modalOverlay').classList.add('open'));
  document.getElementById('modalOverlay').addEventListener('click', e=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
}
function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  if(!overlay) return;
  overlay.classList.remove('open');
  setTimeout(()=>{ document.getElementById('modal-root').innerHTML=''; }, 160);
}
function confirmModal(title, body, onConfirm, confirmLabel){
  openModal(`
    <div class="modal-head"><div class="modal-title">${title}</div>
      <button class="modal-close" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--text-secondary);line-height:1.6">${body}</p></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confirmBtn">${confirmLabel||'Confirmar'}</button>
    </div>`);
  document.getElementById('confirmBtn').addEventListener('click', ()=>{ onConfirm(); closeModal(); });
}

  `;
};

function sortList(list, key, dir){
  return [...list].sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(typeof av==='string') return av.localeCompare(bv)*dir;
    return (av-bv)*dir;
  });
}

/* ============================================================
   PAGE: PARKING (operational dashboard)
   ============================================================ */
VIEW_RENDERERS.parking = function(params){
  const mallId = (params&&params.mallId) || (state.selectedMall!=='all' ? state.selectedMall : 'm1');
  const mall = mallById(mallId);
  const sectors = DB.parkingSectors[mallId] || [];
  const totalSpaces = sectors.reduce((s,x)=>s+x.spaces,0);
  const occupiedSpaces = sectors.reduce((s,x)=>s+Math.round(x.spaces*x.occupied/100),0);
  const available = totalSpaces-occupiedSpaces;
  const pct = ((occupiedSpaces/totalSpaces)*100).toFixed(1);

  return `
    <div class="page-header">
      <div><h1 class="page-title">Estacionamento</h1><p class="page-subtitle">Painel operacional de vagas em tempo real.</p></div>
      <select class="select-filter" id="parkingMallSelect">
        ${DB.malls.map(m=>`<option value="${m.id}" ${m.id===mallId?'selected':''}>${m.name}</option>`).join('')}
      </select>
    </div>

    <div class="dash-grid-3">
      <div class="kpi-card">
        <div class="kpi-top"><div class="kpi-icon" style="background:var(--accent-2-soft);color:var(--accent-2)">${icon('square-parking')}</div></div>
        <div class="kpi-label">Total de Vagas</div><div class="kpi-value num">${fmtNum(totalSpaces)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><div class="kpi-icon" style="background:var(--warning-soft);color:var(--warning)">${icon('car')}</div></div>
        <div class="kpi-label">Ocupadas</div><div class="kpi-value num">${fmtNum(occupiedSpaces)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-top"><div class="kpi-icon" style="background:var(--success-soft);color:var(--success)">${icon('circle-check')}</div></div>
        <div class="kpi-label">Disponíveis</div><div class="kpi-value num">${fmtNum(available)}</div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:4px">Ocupação Atual — ${mall?.name}</div>
        <div class="section-desc" style="margin-bottom:18px">Percentual geral de vagas ocupadas</div>
        <div style="display:flex;align-items:center;justify-content:center;padding:10px 0 6px">
          <div style="position:relative;width:180px;height:180px">
            <svg viewBox="0 0 120 120" style="width:100%;height:100%;transform:rotate(-90deg)">
              <circle cx="60" cy="60" r="52" fill="none" stroke="var(--panel-3)" stroke-width="12"/>
              <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent-2)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52*(1-pct/100)}"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div style="font-size:28px;font-weight:800;font-family:var(--font-display)" class="num">${pct}%</div>
              <div style="font-size:11px;color:var(--text-muted)">ocupação</div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div><div class="section-title">Ocupação ao Longo do Dia</div><div class="section-desc">Média horária de ocupação</div></div></div>
        <div class="chart-wrap" style="height:220px"><canvas id="parkingChart"></canvas></div>
      </div>
    </div>

    <div class="section-title" style="margin:20px 0 12px">Setores de Estacionamento</div>
    <div class="kpi-grid">
      ${sectors.map(sec=>{
        const color = sec.occupied>=85 ? 'danger' : sec.occupied>=70 ? 'warning' : 'success';
        return `
        <div class="kpi-card">
          <div class="kpi-top">
            <div class="kpi-icon" style="background:var(--${color}-soft);color:var(--${color})">${icon('square-parking')}</div>
            <span class="badge badge-${color==='success'?'success':color==='warning'?'warning':'danger'}">${sec.occupied}%</span>
          </div>
          <div class="kpi-label">${sec.name}</div>
          <div class="kpi-value num" style="font-size:19px;margin-bottom:10px">${fmtNum(sec.spaces)} vagas</div>
          <div class="progress-track"><div class="progress-fill" style="width:${sec.occupied}%;background:var(--${color})"></div></div>
        </div>`;
      }).join('')}
    </div>
  `;
};

    const rev = stores.reduce((s,x)=>s+x.revenue,0);
    return { cat:c, rev, count:stores.length };
  }).sort((a,b)=>b.rev-a.rev);
  const maxCatRev = Math.max(...catPerf.map(c=>c.rev),1);

  return `
    <div class="page-header">
      <div><h1 class="page-title">Analytics</h1><p class="page-subtitle">Inteligência de negócios sobre performance da rede.</p></div>

      </div>
    </div>

    <div class="dash-grid" style="grid-template-columns:1fr 1fr">
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:14px">Performance por Categoria</div>
        ${catPerf.map(c=>`
          <div class="rating-bar-row">
            <span class="lbl" style="width:110px">${CAT_LABEL_PT[c.cat]}</span>
            <div class="progress-track"><div class="progress-fill" style="width:${(c.rev/maxCatRev)*100}%;background:var(--accent-2)"></div></div>
            <span class="pct" style="width:80px;text-align:right">${fmtBRL(c.rev)}</span>
          </div>
        `).join('')}
      </div>
      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:6px">Top Lojas por Performance</div>
        ${topStores.map((s,i)=>`
          <div class="perf-row">
            <div class="perf-rank">${i+1}</div>
            <div class="mini-avatar">${initials(s.name)}</div>
            <div style="flex:1">
              <div class="perf-name">${s.name}</div>
              <div class="perf-sub">${mallById(s.mallId)?.name} · ${CAT_LABEL_PT[s.category]}</div>
            </div>
            <div class="perf-val num">${fmtBRL(s.revenue)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="dash-grid-3">
      <div class="kpi-card">
        <div class="kpi-label">Ocupação Média da Rede</div>
        <div class="kpi-value num">${(DB.malls.reduce((s,m)=>s+m.occupancy,0)/DB.malls.length).toFixed(1)}%</div>
        <div class="kpi-trend"><span class="trend-up">${icon('trending-up')}+2.1%</span><span class="kpi-trend-label">vs. trimestre anterior</span></div>

      <div class="kpi-card">

function deleteRecord(arrName, id, label){

/* ============================================================
   GLOBAL EVENT DELEGATION (attached once)
   ============================================================ */
function initDelegation(){
  const root = document.getElementById('view-root');

  root.addEventListener('click', e=>{
    const t = e.target;

    // ---- action buttons first (they may be nested inside clickable rows/cards,
    // so these must be resolved before the generic "open" handlers below) ----

    // ---- add buttons ----
    if(t.closest('#addMallBtn')){ openMallForm(); return; }
    if(t.closest('#addStoreBtn')){ openStoreForm(); return; }
    if(t.closest('#addStoreFromMallBtn')){ const m = mallById(state.params.mallId); openStoreForm(null); if(m) setTimeout(()=>{ const sel=document.getElementById('f_mall'); if(sel) sel.value=m.id; },0); return; }
    if(t.closest('#addCustomerBtn')){ openCustomerForm(); return; }
    if(t.closest('#addEmployeeBtn')){ openEmployeeForm(); return; }
    if(t.closest('#addEmployeeFromStoreBtn')){ openEmployeeForm(state.params.storeId); return; }
    if(t.closest('#addContractBtn')){ openContractForm(); return; }
    if(t.closest('#editMallBtn')){ openMallForm(mallById(state.params.mallId)); return; }
    if(t.closest('#exportBtn')){ toast('Relatório exportado com sucesso.', 'info'); return; }

    // ---- edit ----
    const storeEdit = t.closest('[data-store-edit]');
    if(storeEdit){ openStoreForm(storeById(storeEdit.dataset.storeEdit)); return; }

    // ---- delete ----
    const storeDel = t.closest('[data-store-delete]');
    if(storeDel){ deleteRecord('stores', storeDel.dataset.storeDelete, 'Loja'); return; }
    const custDel = t.closest('[data-customer-delete]');
    if(custDel){ deleteRecord('customers', custDel.dataset.customerDelete, 'Cliente'); return; }
    const empDel = t.closest('[data-employee-delete]');
    if(empDel){ deleteRecord('employees', empDel.dataset.employeeDelete, 'Funcionário'); return; }
    const contractDel = t.closest('[data-contract-delete]');
    if(contractDel){ deleteRecord('contracts', contractDel.dataset.contractDelete, 'Contrato'); return; }
    const reviewDel = t.closest('[data-review-delete]');
    if(reviewDel){ deleteRecord('reviews', reviewDel.dataset.reviewDelete, 'Avaliação'); return; }

    // table sort headers
    const sortTh = t.closest('[data-sort]');
    if(sortTh){
      const f = state.filters.stores;
      if(f){
        if(f.sort === sortTh.dataset.sort) f.dir *= -1; else { f.sort = sortTh.dataset.sort; f.dir = 1; }
        render();
      }
      return;
    }

    // store detail tabs
    const storeTab = t.closest('[data-store-tab]');
    if(storeTab){ navigate('storeDetail', { storeId: state.params.storeId, tab: storeTab.dataset.storeTab }); return; }

    // settings tabs
    const settingsTab = t.closest('[data-settings-tab]');
    if(settingsTab){ navigate('settings', { tab: settingsTab.dataset.settingsTab }); return; }

    // theme swatches in settings
    const themeSet = t.closest('[data-theme-set]');
    if(themeSet){
      const want = themeSet.dataset.themeSet;
      if(want !== state.theme) toggleTheme();
      render(); return;
    }

    // toggles
    const toggle = t.closest('[data-toggle]');
    if(toggle){ toggle.classList.toggle('on'); return; }

    // ---- generic "open" handlers (row/card is clickable as a whole) ----

    // generic nav buttons inside content
    const navEl = t.closest('[data-nav]');
    if(navEl && navEl.closest('#view-root')){
      const p = navEl.dataset.navParams ? JSON.parse(navEl.dataset.navParams) : {};
      navigate(navEl.dataset.nav, p); return;
    }

    // mall card open
    const mallOpen = t.closest('[data-mall-open]');
    if(mallOpen){ navigate('mallDetail', { mallId: mallOpen.dataset.mallOpen }); return; }

    // store open
    const storeOpen = t.closest('[data-store-open]');
    if(storeOpen){ navigate('storeDetail', { storeId: storeOpen.dataset.storeOpen }); return; }

    // customer open
    const custOpen = t.closest('[data-customer-open]');
    if(custOpen){ navigate('customerDetail', { customerId: custOpen.dataset.customerOpen }); return; }

    // employee open
    const empOpen = t.closest('[data-employee-open]');
    if(empOpen){ navigate('employeeDetail', { employeeId: empOpen.dataset.employeeOpen }); return; }

    // contract open (modal)
    const contractOpen = t.closest('[data-contract-open]');
    if(contractOpen){ openContractDetail(contractOpen.dataset.contractOpen); return; }
  });

  root.addEventListener('input', e=>{
    const id = e.target.id;
    const v = e.target.value;
    const map = {
      mallSearch: ['malls','q'], storeSearch: ['stores','q'], customerSearch: ['customers','q'],
      employeeSearch: ['employees','q'], contractSearch: ['contracts','q'],
    };
    if(map[id]){ setFilter(map[id][0], map[id][1], v, id); }
  });

  root.addEventListener('change', e=>{
    const id = e.target.id;
    const v = e.target.value;
    const map = {
      mallStatusFilter: ['malls','status'], storeMallFilter: ['stores','mall'], storeCatFilter: ['stores','category'],
      storeStatusFilter: ['stores','status'], customerStatusFilter: ['customers','status'],
      employeeMallFilter: ['employees','mall'], employeePositionFilter: ['employees','position'],
      reviewRatingFilter: ['reviews','rating'], reviewMallFilter: ['reviews','mall'], reviewStatusFilter: ['reviews','status'],
      contractStatusFilter: ['contracts','status'],
    };
    if(map[id]){ setFilter(map[id][0], map[id][1], v); return; }
    if(id==='parkingMallSelect'){ navigate('parking', { mallId: v }); return; }
  });

  // keyboard: escape closes modal
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') closeModal();
  });
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', ()=>{
  initDelegation();
  render();
});

</script>
</body>
</html>
